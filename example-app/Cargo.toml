[package]
name    = "poli-page-rocket-example-app"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
poli-page-rocket   = { path = ".." }
poli-page          = "0.9.0"
rocket             = { version = "0.5", features = ["json"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
dotenvy            = "0.15"
tokio              = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bytes              = "1.7"

# Same pin as the crate's own Cargo.toml; remove it with that one.
[patch.crates-io]
poli-page = { git = "https://github.com/poli-page/sdk-rust", rev = "001eaac0507675826fb600232a0ff48c82d91c65" }

[[bin]]
name = "example-app"
path = "src/main.rs"

[[bin]]
name = "render_to_file"
path = "src/bin/render_to_file.rs"
