name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', 'beta', '1.93']
    env:
      # rust-toolchain.toml pins stable; without this every leg builds with stable.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            example-app
      - name: Toolchain
        run: rustc -V && cargo -V
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: API contract
        id: contract
        uses: poli-page/api-contract@1f705b3ce3e15ff56e2f7b8249c1a2983af2312c # v0.13.0
      - name: Test
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: cargo test
      - name: Doc
        run: cargo doc --no-deps
      - name: Example app format
        working-directory: example-app
        run: cargo fmt --check
      - name: Example app clippy
        working-directory: example-app
        run: cargo clippy --all-targets -- -D warnings
      - name: Example app build
        working-directory: example-app
        run: cargo build --bins
      - name: Example app tests and API contract cases
        working-directory: example-app
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: cargo test

  coverage:
    runs-on: ubuntu-latest
    # Required by codecov-action's tokenless (OIDC) upload on public repos,
    # which avoids a CODECOV_TOKEN secret. Same setup as the poli-page SDK.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-llvm-cov
      - name: Generate lcov coverage
        run: cargo llvm-cov --locked --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./lcov.info
          use_oidc: true
          fail_ci_if_error: false

  integration:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          case "$POLI_PAGE_API_KEY" in
            pp_sandbox_*) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::POLI_PAGE_API_KEY is not set or is not a pp_sandbox_ key: skipping the live API test."
              echo "present=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v7
        if: steps.key.outputs.present == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: steps.key.outputs.present == 'true'
        with:
          toolchain: stable
      - name: Live API test (sandbox key)
        if: steps.key.outputs.present == 'true'
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
        run: |
          # An unset secret expands to an empty string; drop it so the SDK
          # falls back to its default base URL.
          if [ -z "$POLI_PAGE_BASE_URL" ]; then unset POLI_PAGE_BASE_URL; fi
          cargo test -- --ignored
