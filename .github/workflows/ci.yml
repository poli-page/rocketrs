name: CI
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', 'beta', '1.93']
    env:
      # rust-toolchain.toml pins stable; without this every leg builds with stable.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            example-app
      - name: Toolchain
        run: rustc -V && cargo -V
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: API contract
        id: contract
        uses: poli-page/api-contract@d27bb4241a49bcef8d8901745f9f6bab30f43b8b # v1.4.0
      - name: Test
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: cargo test
      - name: Doc
        run: cargo doc --no-deps
      - name: Example app format
        working-directory: example-app
        run: cargo fmt --check
      - name: Example app clippy
        working-directory: example-app
        run: cargo clippy --all-targets -- -D warnings
      - name: Example app build
        working-directory: example-app
        run: cargo build --bins
      - name: Example app tests and API contract cases
        working-directory: example-app
        env:
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: cargo test

  integration:
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check for the sandbox API key
        id: key
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
        run: |
          case "$POLI_PAGE_API_KEY" in
            pp_sandbox_*) echo "present=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::notice::POLI_PAGE_API_KEY is not set or is not a pp_sandbox_ key: skipping the live API test."
              echo "present=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
      - uses: dtolnay/rust-toolchain@master
        if: steps.key.outputs.present == 'true'
        with:
          toolchain: stable
      - name: Live API test (sandbox key)
        if: steps.key.outputs.present == 'true'
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_BASE_URL }}
        run: |
          # An unset secret expands to an empty string; drop it so the SDK
          # falls back to its default base URL.
          if [ -z "$POLI_PAGE_BASE_URL" ]; then unset POLI_PAGE_BASE_URL; fi
          cargo test -- --ignored
