name: Release

# Tag-driven publish of `poli-page-rocket` to crates.io via Trusted Publishing
# (OIDC): no long-lived token lives in this repo. Mirrors the release workflow
# of the `poli-page` SDK (poli-page/sdk-rust). Flow:
#
#   bump Cargo.toml + CHANGELOG on main → CI green → git tag vX.Y.Z → push tag
#     → verify job (full gate, asserts tag == Cargo.toml version and that
#       CHANGELOG.md has the version's section)
#     → publish job PAUSES on the `crates-io-publish` environment for manual approval
#     → on approval: OIDC token → cargo publish → GitHub Release
#
# crates.io has no "pending publisher": a crate must exist before Trusted
# Publishing can be configured for it, so the first version (0.11.0) is
# published by hand with a token (see RELEASING.md). The run for its tag then
# skips the upload and only cuts the GitHub Release.
#
# A pushed tag is the only trigger: there is no workflow_dispatch path, so the
# `crates-io-publish` environment can allow `v*.*.*` tags and nothing else.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            example-app

      # The tag is only the trigger: the version of record is Cargo.toml. Refuse
      # to publish if they disagree, so a mistyped tag can never ship the wrong
      # version to the immutable registry. The CHANGELOG section becomes the
      # GitHub Release notes, so it must exist too.
      - name: Resolve version + assert tag matches Cargo.toml and CHANGELOG
        id: resolve
        run: |
          set -euo pipefail
          CRATE_VERSION="$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name=="poli-page-rocket") | .version')"
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="v${CRATE_VERSION}"
          if [[ "$TAG" != "$EXPECTED" ]]; then
            echo "::error::Tag '$TAG' does not match Cargo.toml version ('$EXPECTED'). Bump Cargo.toml and re-tag." >&2
            exit 1
          fi
          if ! grep -qF "## [${CRATE_VERSION}] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${CRATE_VERSION}] - YYYY-MM-DD' section." >&2
            exit 1
          fi
          echo "version=${CRATE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (Cargo.toml = ${CRATE_VERSION})"

      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo doc --no-deps --all-features --locked
      # The release runs the example app's API contract tests
      # (example-app/tests/contract.rs) against the version ci.yml pins.
      - name: API contract
        id: contract
        uses: poli-page/api-contract@d27bb4241a49bcef8d8901745f9f6bab30f43b8b # v1.4.0
      - run: cargo test --all-features --locked
        env:
          CI: "true"
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
      - name: Example app format
        working-directory: example-app
        run: cargo fmt --check
      - name: Example app clippy
        working-directory: example-app
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Example app tests and API contract cases
        working-directory: example-app
        env:
          CI: "true"
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          test -s "$POLI_CONTRACT" || { echo "::error::API contract file missing: '$POLI_CONTRACT'"; exit 1; }
          cargo test --locked
      # Advisories only: licence and source checks would need a deny.toml.
      - name: cargo deny (advisories)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          command-arguments: advisories
          arguments: ""
      # Builds the packaged crate (Cargo.toml `include` list: src, README,
      # CHANGELOG, licences) on its own, without the example app or tests.
      - run: cargo publish --dry-run --locked

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    # Manual-approval gate: configure `crates-io-publish` in repo Settings →
    # Environments with required reviewers. The job blocks here until approved.
    environment: crates-io-publish
    permissions:
      contents: write   # create the GitHub Release
      id-token: write   # OIDC exchange for Trusted Publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable @ 2026-05
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Idempotency: if this version is already on crates.io (a re-run, or the
      # hand-published 0.11.0 bootstrap), skip the upload but still cut the Release.
      - name: Check whether version is already published
        id: published
        env:
          VER: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: poli-page-release-workflow (github.com/poli-page/rocketrs)' \
            "https://crates.io/api/v1/crates/poli-page-rocket/${VER}")"
          if [[ "$CODE" == "200" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "poli-page-rocket ${VER} is already on crates.io; will skip cargo publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "poli-page-rocket ${VER} not yet published (HTTP ${CODE}); will publish."
          fi

      # Always run the OIDC exchange (even when the upload below is skipped),
      # so the hand-published 0.11.0 tag still validates that Trusted Publishing
      # is wired correctly. The minted token is short-lived and auto-revoked at
      # job end whether or not it's used.
      - name: Trusted Publishing auth (OIDC → short-lived crates.io token)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: cargo publish
        if: steps.published.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

      - name: Extract CHANGELOG section for release notes
        id: notes
        env:
          VER: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/release-notes.md"
          awk -v ver="$VER" '
            index($0, "## [" ver "]") == 1 { cap = 1; next }
            cap && /^## \[/                 { exit }
            cap                             { print }
          ' CHANGELOG.md > "$NOTES"
          if [[ ! -s "$NOTES" ]]; then
            echo "_See [CHANGELOG.md](CHANGELOG.md) for details._" > "$NOTES"
          fi
          echo "file=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          NOTES_FILE: ${{ steps.notes.outputs.file }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          [[ "$TAG" == *-* ]] && PRERELEASE="--prerelease"   # vX.Y.Z-rc.N etc.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file "$NOTES_FILE" \
              $PRERELEASE
          fi
